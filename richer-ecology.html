<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Evolution richer-ecology characterization</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #edf9f1;
        background: #07120e;
      }
      body {
        max-width: 72rem;
        margin: 0 auto;
        padding: 2rem;
      }
      h1 {
        font:
          700 clamp(2rem, 7vw, 4rem) / 1 system-ui,
          sans-serif;
        margin-bottom: 0.5rem;
      }
      p {
        color: #b9c8bf;
        line-height: 1.6;
      }
      pre {
        padding: 1rem;
        border: 1px solid #294438;
        border-radius: 0.5rem;
        overflow: auto;
        background: #0a1711;
        line-height: 1.45;
      }
      .error {
        color: #ff9d87;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Repeatable model diagnostic</p>
      <h1>Richer-ecology characterization</h1>
      <p>
        Runs the fixed multi-seed refuge counterfactual with habitats, diet
        specialization, predation, defense, and terrain enabled. The output is
        deterministic and machine-readable.
      </p>
      <p id="status" role="status">Running characterization…</p>
      <pre
        id="report"
        aria-label="Machine-readable characterization report"
      ></pre>
    </main>
    <script
      type="module"
      src="/src/development/richer-ecology-characterization-page.ts"
    ></script>
  </body>
</html>
